services:
  postgres:
    image: postgres:16-alpine
    container_name: integrityops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: integrityops
      POSTGRES_PASSWORD: integrityops_dev_password
      POSTGRES_DB: integrityops
    ports:
      - "5433:5432"
    volumes:
      - integrityops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integrityops -d integrityops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  integrityops_pgdata:
