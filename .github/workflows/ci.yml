name: CI Verification Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: lead_integrity_ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Setup Prisma Client & PostgreSQL Database
        env:
          DATABASE_URL: "postgresql://postgres:password123@localhost:5432/lead_integrity_ops?schema=public"
        run: |
          npx prisma generate
          npx prisma db push
          npx tsx scripts/seed.ts

      - name: Run 7-Gate Deterministic Verification Suite
        env:
          DATABASE_URL: "postgresql://postgres:password123@localhost:5432/lead_integrity_ops?schema=public"
        run: npm run verify

      - name: Next.js Production Build
        env:
          DATABASE_URL: "postgresql://postgres:password123@localhost:5432/lead_integrity_ops?schema=public"
        run: npm run build
