name: CI Verification Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: lead-integrity-ops-platform/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: lead-integrity-ops-platform

      - name: Setup Prisma Client & SQLite DB
        run: |
          npx prisma generate
          npx prisma db push
          npx tsx scripts/seed.ts
        working-directory: lead-integrity-ops-platform

      - name: Run 6-Gate Deterministic Verification Suite
        run: npm run verify
        working-directory: lead-integrity-ops-platform

      - name: Next.js Production Build
        run: npm run build
        working-directory: lead-integrity-ops-platform
